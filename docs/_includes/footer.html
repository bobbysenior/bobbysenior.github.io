<footer>
    &copy; {{ site.time | date: "%Y" }} Thomas MEZINO.
    {% if page.nav_active == "legal" %}
        <a href="{{ '/' | relative_url }}" data-i18n="nav.home">Home</a>
    {% else %}
        <a href="{{ '/legal-mentions/' | relative_url }}" data-i18n="footer.legal">Legal mentions</a>
    {% endif %}
</footer>

<script>
    (function () {
        var btn = document.getElementById("theme-toggle");
        if (!btn) return;
        var root = document.documentElement;

        function syncIcon() {
            var light = root.getAttribute("data-theme") === "light";
            // Icône et étiquette = ce vers quoi on bascule
            btn.textContent = light ? "☀" : "☾";
            var french = root.lang === "fr";
            var label = light
                ? (french ? "Passer au thème sombre" : "Switch to dark theme")
                : (french ? "Passer au thème clair" : "Switch to light theme");
            btn.setAttribute("aria-label", label);
            btn.setAttribute("title", label);
        }
        syncIcon();

        btn.addEventListener("click", function () {
            var light = root.getAttribute("data-theme") === "light";
            if (light) {
                root.removeAttribute("data-theme");
                localStorage.setItem("theme", "dark");
            } else {
                root.setAttribute("data-theme", "light");
                localStorage.setItem("theme", "light");
            }
            syncIcon();
        });

        document.addEventListener("languagechange", syncIcon);
    })();
</script>
