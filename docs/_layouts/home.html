<!doctype html>
<html lang="en" data-page="home">
    {% include head.html %}
    <body>
        <a class="skip-link" href="#main-content" data-i18n="skip.content">Skip to content</a>

        <!-- ===================== Loader (animation ℵ₀) ===================== -->
        <div id="loader" aria-hidden="true">
            <div id="stage">
                <svg
                    id="svg"
                    viewBox="0 0 400 400"
                    xmlns="http://www.w3.org/2000/svg"
                    focusable="false"
                ></svg>
            </div>
        </div>

        <!-- ===================== Contenu ===================== -->
        <main id="content">
            <div class="wrap" id="main-content" tabindex="-1">
                {% include nav.html %}
                {{ content }}
                {% include footer.html %}
            </div>
        </main>

        <script>
            (function () {
            const root = document.documentElement;
            const loaderEl = document.getElementById("loader");

            // Pas de .js-intro (JS partiel, ou prefers-reduced-motion) :
            // le CSS affiche déjà le contenu, on retire simplement le loader.
            if (!root.classList.contains("js-intro")) {
                if (loaderEl) loaderEl.remove();
                return;
            }

            // Le contenu n'est qu'à opacity:0 sous le loader : sans `inert`, on
            // peut y tabuler et donner le focus à des liens invisibles.
            const contentEl = document.getElementById("content");
            function unlockContent() {
                if (contentEl) contentEl.removeAttribute("inert");
            }
            if (contentEl) contentEl.setAttribute("inert", "");
            // Aligné sur le filet de sécurité du head : le contenu ne doit
            // jamais rester inerte si l'animation n'aboutit pas.
            setTimeout(unlockContent, 2000);

            const ALEPH = "ℵ";
            const ZERO = "₀";

            const NS = "http://www.w3.org/2000/svg";
            const svg = document.getElementById("svg");

            function makeStrokedText(ch, size, x, y) {
                const t = document.createElementNS(NS, "text");
                t.setAttribute("x", x);
                t.setAttribute("y", y);
                t.setAttribute(
                    "font-family",
                    "'Times New Roman', 'STIX Two Math', serif",
                );
                t.setAttribute("font-size", size);
                // Via style : les variables CSS ne sont pas fiables dans les
                // attributs de présentation SVG.
                t.style.fill = "var(--fg)";
                t.style.stroke = "var(--fg)";
                t.setAttribute("stroke-width", "1.2");
                t.setAttribute("stroke-linejoin", "round");
                t.setAttribute("stroke-linecap", "round");
                t.setAttribute("text-anchor", "middle");
                t.textContent = ch;
                return t;
            }

            const aleph = makeStrokedText(ALEPH, 230, 175, 250);
            const zero = makeStrokedText(ZERO, 230, 285, 300);
            svg.appendChild(aleph);
            svg.appendChild(zero);

            function setupDash(el) {
                const box = el.getBBox();
                const dash = (box.width + box.height) * 3;
                el.style.strokeDasharray = dash;
                el.style.strokeDashoffset = dash;
                el.style.fillOpacity = 0;
                return dash;
            }

            function animate(
                el,
                dash,
                { drawTime, fillStart, fillTime, delay },
                onEnd,
            ) {
                const start = performance.now() + delay;
                function frame(now) {
                    const t = now - start;
                    if (t < 0) {
                        requestAnimationFrame(frame);
                        return;
                    }
                    const dp = Math.min(t / drawTime, 1);
                    const e = dp < 0.5 ? 2 * dp * dp : -1 + (4 - 2 * dp) * dp; // easeInOut
                    el.style.strokeDashoffset = dash * (1 - e);
                    if (t > fillStart) {
                        const fp = Math.min((t - fillStart) / fillTime, 1);
                        el.style.fillOpacity = fp;
                    }
                    if (dp < 1 || t - fillStart < fillTime) {
                        requestAnimationFrame(frame);
                    } else if (onEnd) {
                        onEnd();
                    }
                }
                requestAnimationFrame(frame);
            }

            function reveal() {
                const content = document.getElementById("content");
                loaderEl.classList.add("done");
                content.classList.add("visible");
                unlockContent();
                setTimeout(() => {
                    loaderEl.remove();
                    root.classList.remove("js-intro");
                }, 450);
            }

            function run() {
                // Le filet de sécurité du head a pu retirer .js-intro entre-temps
                // (polices très lentes) : le loader est alors masqué et getBBox()
                // échoue. Le contenu étant déjà visible, on se contente de sortir.
                if (!root.classList.contains("js-intro")) {
                    skipLoader();
                    return;
                }
                const dA = setupDash(aleph);
                const dZ = setupDash(zero);
                animate(aleph, dA, {
                    drawTime: 550,
                    fillStart: 350,
                    fillTime: 350,
                    delay: 50,
                });
                // le ₀ termine en dernier -> on déclenche la révélation à sa fin
                animate(
                    zero,
                    dZ,
                    {
                        drawTime: 550,
                        fillStart: 350,
                        fillTime: 350,
                        delay: 88,
                    },
                    () => setTimeout(reveal, 125),
                );
            }

            function skipLoader() {
                const content = document.getElementById("content");
                content.style.transition = "none";
                content.classList.add("visible");
                loaderEl.remove();
                root.classList.remove("js-intro");
                unlockContent();
            }

            // L'animation ne se joue qu'une fois par session ; on l'ignore
            // ensuite (navigation, retour à l'accueil).
            if (sessionStorage.getItem("introPlayed")) {
                skipLoader();
            } else {
                sessionStorage.setItem("introPlayed", "1");
                if (document.fonts && document.fonts.ready) {
                    document.fonts.ready.then(run);
                } else {
                    window.addEventListener("load", run);
                }
            }
            })();
        </script>
    </body>
</html>
